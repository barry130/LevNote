# 持续集成。
#
# ## 四个刻意的决定
#
# 1. **前端与 Rust 分成两个 job，不串行。** 它们互相独立（前端跑在 Node 里，
#    Rust 那 11 条测试不需要 WebView），串起来只会让反馈变慢。
#    这也是 `cargo test` 能在 CI 上跑的原因 —— 它不需要图形环境。
#
# 2. **`vite build` 单独跑一次，而不是混在 typecheck 里。**
#    `tsc --noEmit` 通过不代表 Vite 能打包（路径别名、CSS `?raw`、动态 import
#    都只有在真正的打包器里才会暴露）。这两件事的失败原因完全不同，
#    分开跑能让「哪一步坏了」一眼可见。
#
# 3. **Ubuntu 上装 WebKitGTK 的依赖。** Tauri 的 Rust 侧要链接它才能编译。
#    不装的话 `cargo test` 会在链接阶段失败，而不是在代码阶段失败 ——
#    那种失败信息会让人以为是代码问题。
#
# 4. **ESLint 是阻塞的。** 它一开始以 `continue-on-error` 引入（首轮有 33 条
#    历史问题），欠账清零后就转成阻塞。「有规则但不执行」比「没有规则」更糟，
#    因为它让人以为已经守住了。
#
# 刻意**不做**的：不在 CI 上出安装包（`tauri build`）。它需要各平台的原生工具链，
# 而产物体积大、跑得慢，收益只有「确保打包没坏」。
# 等 P7 的签名流水线落地时再一起做。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端（类型 / 规范 / 测试 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 的版本由 `packageManager` 字段钉住（pnpm/action-setup 默认读它），
      # 本地与 CI 永远是同一个版本 —— 不在这里再写一遍，两处会漂。
      # 必须排在 setup-node 之前：下一步的 `cache: pnpm` 要找到 pnpm 才能算出缓存键。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile：锁文件与 package.json 对不上时直接失败，
      # 而不是悄悄按最新范围重装 —— CI 装的必须就是锁文件里那份。
      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      # lint **阻塞**（不再是 continue-on-error）。
      #
      # 它曾经是非阻塞的：刚接入时首轮全量扫描有 33 条历史问题，让它直接
      # 把 CI 变红只会训练人忽略红灯。现在欠账已清零，就换成阻塞 ——
      # 「有规则但不执行」和「没有规则」在效果上是一样的，而前者更糟，
      # 因为它让人以为已经守住了。
      #
      # 与 TS 双大版本共存的关系见 ADR 0013。
      - name: ESLint
        run: pnpm run lint

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm exec vite build

  rust:
    name: Rust（格式 / 检查 / 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上需要这些系统库才能编译
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
